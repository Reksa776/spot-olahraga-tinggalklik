name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: tinggalklik-production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Deploy latest main revision
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
        run: |
          set -Eeuo pipefail

          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS DEPLOY_PATH; do
            if [[ -z "${!name:-}" ]]; then
              echo "Required GitHub secret/variable is missing: $name" >&2
              exit 1
            fi
          done

          if [[ ! "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]]; then
            echo "DEPLOY_PATH must be an absolute path containing only letters, numbers, dot, underscore, slash, or hyphen." >&2
            exit 1
          fi

          key_file="$RUNNER_TEMP/tinggalklik_deploy_key"
          known_hosts_file="$RUNNER_TEMP/tinggalklik_known_hosts"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$key_file"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$known_hosts_file"
          chmod 600 "$key_file" "$known_hosts_file"

          remote_command="$(printf 'DEPLOY_PATH=%q bash -s' "$DEPLOY_PATH")"
          ssh \
            -i "$key_file" \
            -p "${DEPLOY_PORT:-22}" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$known_hosts_file" \
            -o ConnectTimeout=20 \
            "$DEPLOY_USER@$DEPLOY_HOST" "$remote_command" <<'REMOTE'
          set -Eeuo pipefail

          cd "$DEPLOY_PATH"
          if [[ ! -d .git ]]; then
            echo "DEPLOY_PATH is not a Git checkout: $DEPLOY_PATH" >&2
            exit 1
          fi

          if [[ -n "$(git status --porcelain)" ]]; then
            echo "Deployment stopped: the VPS checkout has local changes. Review them before deploying." >&2
            git status --short >&2
            exit 1
          fi

          git fetch origin main
          git checkout main
          git pull --ff-only origin main

          if [[ -s "$HOME/.nvm/nvm.sh" ]]; then
            . "$HOME/.nvm/nvm.sh"
            nvm use
          fi

          npm ci

          # Schema changes require the documented pre-deploy backup and migration procedure.
          # Stop here when the database is not already aligned with this release.
          npx prisma migrate status
          npx prisma generate
          npm run build

          pm2 reload tinggalklik
          pm2 restart tinggalklik-worker
          pm2 restart tinggalklik-jobs-tick
          pm2 save

          curl --fail --silent --show-error http://127.0.0.1:3003/api/health/ready >/dev/null
          echo "Production deploy completed successfully."
          REMOTE

          rm -f "$key_file" "$known_hosts_file"
